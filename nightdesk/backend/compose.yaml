services:
  backend:
    build: .
    restart: unless-stopped
    stop_grace_period: 3m30s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - nightdesk-data:/data
      - ./secrets:/run/nightdesk:ro
    environment:
      NIGHTDESK_DB: /data/nightdesk.sqlite
      NIGHTDESK_TOKEN_HASH_FILE: /run/nightdesk/token.sha256
      NIGHTDESK_LIVE_CODE_HASH_FILE: /run/nightdesk/live.sha256
      NIGHTDESK_BOT_CODE_HASH_FILE: /run/nightdesk/bot.sha256
      NIGHTDESK_KRAKEN_KEY_FILE: /run/nightdesk/kraken_key
      NIGHTDESK_KRAKEN_SECRET_FILE: /run/nightdesk/kraken_secret
      NIGHTDESK_LIVE: "${NIGHTDESK_LIVE:-NO}"
      NIGHTDESK_MAX_ORDER_EUR: "${NIGHTDESK_MAX_ORDER_EUR:-250}"
      NIGHTDESK_MAX_DAILY_EUR: "${NIGHTDESK_MAX_DAILY_EUR:-500}"
      NIGHTDESK_RISK: "${NIGHTDESK_RISK:-.01}"
      NIGHTDESK_DAILY_LOSS: "${NIGHTDESK_DAILY_LOSS:-.03}"
      NIGHTDESK_DRAWDOWN: "${NIGHTDESK_DRAWDOWN:-.10}"
      NIGHTDESK_MAX_POSITIONS: "${NIGHTDESK_MAX_POSITIONS:-3}"
      NIGHTDESK_PAPER_START: "${NIGHTDESK_PAPER_START:-1000}"

  https:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      NIGHTDESK_DOMAIN: "${NIGHTDESK_DOMAIN:?Set NIGHTDESK_DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nightdesk-data:
  caddy-data:
  caddy-config:
