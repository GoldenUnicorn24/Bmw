name: Bitcoin Lottery Android
on:
  push:
    branches: [bitcoin-lottery-miner]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Bitcoin-Lottery-0.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/Bitcoin-Lottery-0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Lottery-0.1
          path: dist/Bitcoin-Lottery-0.1.apk
          if-no-files-found: error
