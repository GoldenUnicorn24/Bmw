name: MemePulse - public market research (3x weekly)
on:
  schedule:
    # UTC: Monday, Wednesday, Saturday; research only, NO live trades.
    - cron: '20 3 * * 1,3,6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memepulse-research-main
  cancel-in-progress: false
jobs:
  backtest-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated MemePulse training source branch
        uses: actions/checkout@v4
        with:
          ref: feature/memepulse-v06-train-lab
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore expanding historical OHLCV candle archive
        uses: actions/cache@v4
        with:
          path: memepulse/backend/research-output/dataset.json
          key: memepulse-nightly-history-${{ github.run_id }}
          restore-keys: |
            memepulse-nightly-history-
      - name: Verify source and train only with PUBLIC real historical data
        working-directory: memepulse/backend
        env:
          RESEARCH_POOL_LIMIT: "18"
          ENABLE_LIVE_TRADES: "NO"
          ALLOW_AUTONOMOUS_LIVE: "NO"
        run: |
          node --check research/features.mjs
          node --check research/learner.mjs
          node --check scripts/collect-and-train.mjs
          npm test
          npm run train:research
      - name: Publish research-only dataset and untouched holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemePulse-real-market-research-${{ github.run_id }}
          path: memepulse/backend/research-output/
          retention-days: 30
          if-no-files-found: warn

  verified-meme-coins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/memepulse-v08-live-safety-and-meme-data
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Independently verify CoinGecko Solana meme category and research candles
        working-directory: memepulse/backend
        env:
          MEME_COIN_LIMIT: "16"
          MEME_CANDLE_PAGES: "3"
          MEME_POOL_TRIES: "2"
          ENABLE_LIVE_TRADES: "NO"
          ALLOW_AUTONOMOUS_LIVE: "NO"
          ENABLE_WALLET_WITHDRAWALS: "NO"
        run: |
          node --check scripts/collect-meme-research.mjs
          node scripts/collect-meme-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemePulse-v08-verified-solana-memes
          path: memepulse/backend/research-output/meme-coins/
          retention-days: 30
          if-no-files-found: warn
  penny-stock-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/memepulse-v08-meme-live-hardening
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Research US listed penny-priced common shares without a broker
        working-directory: memepulse/backend
        env:
          PENNY_TICKER_LIMIT: "45"
          ENABLE_LIVE_TRADES: "NO"
          ALLOW_AUTONOMOUS_LIVE: "NO"
          ENABLE_WALLET_WITHDRAWALS: "NO"
        run: |
          node --check scripts/collect-penny-research.mjs
          node scripts/collect-penny-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemePulse-penny-stock-lab
          path: memepulse/backend/research-output/penny-stocks/
          retention-days: 30
          if-no-files-found: warn
