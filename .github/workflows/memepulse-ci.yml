name: MemePulse AI - Android APK
on:
  push:
    branches:
      - feature/memepulse-ai-android
      - feature/memepulse-v03-pro-trader
    paths:
      - "memepulse/**"
      - ".github/workflows/memepulse-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-risk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies and verify JS syntax
        working-directory: memepulse/backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check server.mjs
          node --check risk.mjs
      - name: Run backend regression tests
        working-directory: memepulse/backend
        run: npm test
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Install SDK platform and tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile native debug APK
        working-directory: memepulse/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp memepulse/android/app/build/outputs/apk/debug/app-debug.apk MemePulseAI-Android-v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MemePulseAI-Android-v0.2-debug-APK
          path: MemePulseAI-Android-v0.2-debug.apk
          retention-days: 30
