name: Build OpenHiggsfield Mobile APK
on:
  push:
    branches: [openhiggsfield-android-apk]
    paths:
      - 'openhiggsfield-android/**'
      - '.github/workflows/build-openhiggsfield-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed debug APK
        working-directory: openhiggsfield-android
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHiggsfield-Mobile-Android-APK
          path: openhiggsfield-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
