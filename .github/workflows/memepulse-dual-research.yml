name: MemePulse v0.7 - Meme Coin and Penny Stock Research
on:
  push:
    branches:
      - feature/memepulse-v07-dual-market-research
      - feature/memepulse-v08-live-safety-and-meme-data
    paths:
      - "memepulse/**"
      - ".github/workflows/memepulse-dual-research.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memepulse-v07-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  meme-coin-research:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check classification integrity and train verified Solana meme coins
        env:
          MEME_COIN_LIMIT: "16"
          MEME_CANDLE_PAGES: "3"
          MEME_POOL_TRIES: "2"
          ENABLE_LIVE_TRADES: "NO"
          ALLOW_AUTONOMOUS_LIVE: "NO"
        working-directory: memepulse/backend
        run: |
          node --check scripts/collect-meme-research.mjs
          node --check research/features.mjs
          node --check research/learner.mjs
          node scripts/collect-meme-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemePulse-v08-VERIFIED-SOLANA-MEME-RESEARCH
          path: memepulse/backend/research-output/meme-coins/
          retention-days: 30
          if-no-files-found: warn
  penny-stock-research:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    if: github.ref != 'refs/heads/feature/memepulse-v08-live-safety-and-meme-data'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Nasdaq listing and obtain historic penny-priced stock examples
        env:
          PENNY_TICKER_LIMIT: "45"
          ENABLE_LIVE_TRADES: "NO"
          ALLOW_AUTONOMOUS_LIVE: "NO"
        working-directory: memepulse/backend
        run: |
          node --check scripts/collect-penny-research.mjs
          node --check research/equity-features.mjs
          node --check research/equity-learner.mjs
          node scripts/collect-penny-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemePulse-v07-US-PENNY-STOCK-RESEARCH
          path: memepulse/backend/research-output/penny-stocks/
          retention-days: 30
          if-no-files-found: warn
