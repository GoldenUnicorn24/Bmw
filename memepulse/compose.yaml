# Example for HTTPS domain on an independently controlled VPS.
services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      TRADE_LOG_PATH: /srv/private/trades.json
      ALLOWLIST_FILE: /srv/private/allowlist.json
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./backend/private:/srv/private
    networks:
      - internal
  caddy:
    image: caddy:2.10-alpine
    environment:
      MEMEPULSE_DOMAIN: ${MEMEPULSE_DOMAIN:?Set real DNS domain in compose .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - internal
networks:
  internal:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
